# 管理后台静态入口。该文件由主站 server 块的 extension include 自动加载。
location = /admin {
    return 301 /admin/;
}

location ^~ /admin/ {
    try_files $uri $uri/ /admin/index.html;
}

# Go API 同域代理。更具体的 /api/v1/chat/completions 和 /api/favorites
# 仍由现有站点配置优先处理，不覆盖历史代理。
location ^~ /api/ {
    client_max_body_size 520m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_pass http://127.0.0.1:8003;
}

# 上传文件与版本目录解耦，升级和回滚时不删除用户文件。
location ^~ /uploads/ {
    alias /www/wwwroot/uiedtool.com/app/shared/uploads/;
    expires 30d;
    add_header Cache-Control "public, no-transform";
}

# 主站是 Vue SPA。只有发布包生成的真实路由允许回退到 index.html，避免未知路径形成软 404。
include /www/wwwroot/uiedtool.com/app/current/frontend/site/frontend-route-allowlist.conf;

# 主站静态资源直接读取文件；文件不存在时返回 404，避免被前台路由白名单吞掉。
location ~* \.(?:js|css|map|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|wasm|json|xml|txt|html)$ {
    try_files $uri =404;
}

# 构建产物带内容哈希，长期不可变缓存；public/ 下未哈希文件不受影响。
location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# 其他前台路径不进入 SPA 回退，直接返回 HTTP 404。
# 正则 location 优先级高于主站配置里的普通前缀 location，必须放行 /api/，
# 否则主站配置中更长普通前缀的 API 代理（如 /api/favorites、/api/v1/chat/completions）会被这里拦截。
location ~ ^/(?!api(?:/|$)) {
    return 404;
}
