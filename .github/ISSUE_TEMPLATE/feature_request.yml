name: 功能建议
description: 提议一个有明确使用场景的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以附上页面、接口或交互建议。
    validations:
      required: true
