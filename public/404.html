<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="description" content="你访问的页面不存在，返回 UIED Tools 首页或浏览工具分类。">
    <title>页面不存在 - UIED Tools</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #202536; background: #f6f7fb; }
      main { width: min(620px, calc(100% - 40px)); box-sizing: border-box; padding: 56px 36px; text-align: center; background: #fff; border: 1px solid #e4e7ec; border-radius: 20px; box-shadow: 0 20px 60px rgba(30, 36, 50, .08); }
      .code { color: #6757ff; font-size: 96px; font-weight: 900; line-height: .9; letter-spacing: -.08em; }
      h1 { margin: 24px 0 12px; font-size: 32px; }
      p { margin: 0 auto; max-width: 440px; color: #707784; line-height: 1.8; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
      a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 10px; color: #fff; background: #6757ff; font-weight: 700; text-decoration: none; }
      a.secondary { color: #303642; background: #f1f2f6; border: 1px solid #e0e3e9; }
      @media (max-width: 480px) { main { padding: 40px 22px; } nav { flex-direction: column; } a { justify-content: center; } }
    </style>
  </head>
  <body>
    <main aria-labelledby="not-found-title">
      <div class="code" aria-hidden="true">404</div>
      <h1 id="not-found-title">页面不存在</h1>
      <p>你访问的地址可能已经失效，或者页面还没有发布。可以返回首页重新搜索工具。</p>
      <nav>
        <a href="/">返回首页</a>
        <a class="secondary" href="/tools/ai/toolbox">浏览工具分类</a>
      </nav>
    </main>
  </body>
</html>
